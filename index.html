<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #111;
      margin-bottom: 24px;
      text-align: center;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
    }

    input {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    input.error {
      border-color: #ef4444;
    }

    .field-error {
      font-size: 0.8rem;
      color: #ef4444;
      min-height: 1em;
    }

    .forgot {
      display: block;
      text-align: right;
      font-size: 0.8rem;
      color: #4f46e5;
      text-decoration: none;
      margin-top: -10px;
      margin-bottom: 22px;
    }

    .forgot:hover { text-decoration: underline; }

    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button[type="submit"]:hover { background: #4338ca; }
    button[type="submit"]:active { background: #3730a3; }

    .toast {
      display: none;
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      text-align: center;
    }

    .toast.success { background: #d1fae5; color: #065f46; }
    .toast.fail    { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <span class="field-error" id="emailError"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" id="togglePassword" aria-label="Toggle password visibility">Show</button>
        </div>
        <span class="field-error" id="passwordError"></span>
      </div>

      <a href="#" class="forgot" tabindex="-1">Forgot password?</a>

      <button type="submit">Sign in</button>

      <div class="toast" id="toast"></div>
    </form>
  </div>


  <script type="module">
    import { validatePassword } from './src/validation.js';

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    let showPassword = false;
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const toast = document.getElementById('toast');

    function validate() {
      let valid = true;

      emailError.textContent = '';
      passwordError.textContent = '';
      emailInput.classList.remove('error');
      passwordInput.classList.remove('error');

      if (!emailInput.value.trim()) {
        emailError.textContent = 'Email is required.';
        emailInput.classList.add('error');
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim())) {
        emailError.textContent = 'Enter a valid email address.';
        emailInput.classList.add('error');
        valid = false;
      }

      const passwordValidationError = validatePassword(passwordInput.value);
      if (passwordValidationError) {
        passwordError.textContent = passwordValidationError;
        passwordInput.classList.add('error');
        valid = false;
      } else if (!/[0-9]/.test(passwordInput.value)) {
        passwordError.textContent = 'Password must contain at least one number.';
        passwordInput.classList.add('error');
        valid = false;
      }

      return valid;
    }

    function showToast(message, type) {
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.style.display = 'block';
    }

    function updatePasswordType() {
      if (!passwordInput) return;
      passwordInput.type = showPassword ? 'text' : 'password';
      if (togglePassword) togglePassword.textContent = showPassword ? 'Hide' : 'Show';
    }

    if (togglePassword) {
      togglePassword.addEventListener('click', function () {
        showPassword = !showPassword;
        updatePasswordType();
      });
    }

    // ensure initial state is correct
    updatePasswordType();


    form.addEventListener('submit', function (e) {
      e.preventDefault();
      toast.style.display = 'none';

      if (!validate()) return;

      showToast('Signed in as ' + emailInput.value.trim(), 'success');
    });
  </script>
</body>
</html>
